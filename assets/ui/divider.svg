<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32" role="img" aria-label=""><style>
.tw{animation:tw 3.4s steps(4) infinite}@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.bob{animation:bob 2.4s steps(2) infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob2{animation:bob 3.2s steps(2) infinite}
.fa{animation:fa 1.2s steps(1) infinite}@keyframes fa{0%{opacity:1}50%{opacity:0}}
.fb{animation:fb 1.2s steps(1) infinite}@keyframes fb{0%{opacity:0}50%{opacity:1}}
.slow{animation-duration:2.4s}
.blink{animation:blink 1.6s steps(1) infinite}@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.25);opacity:.45}}
.steam{animation:steam 2.4s steps(6) infinite}@keyframes steam{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.walk{animation:walk 60s linear infinite}@keyframes walk{from{transform:translateX(-160px)}to{transform:translateX(1360px)}}
.shoot{animation:shoot 10s ease-in infinite;opacity:0}@keyframes shoot{0%,84%{opacity:0;transform:translate(0,0)}86%{opacity:1}94%{opacity:0;transform:translate(-300px,120px)}100%{opacity:0}}
.flow{animation:flow 1.8s steps(6) infinite}@keyframes flow{from{transform:translateX(0)}to{transform:translateX(36px)}}
.scan{animation:scan 2.6s steps(10) infinite alternate}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(60px)}}
.sway{animation:sway 4s steps(2) infinite}@keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
