name: Draw contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # needed only to push the generated SVGs to the "output" branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs in the profile colours
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c0677a&color_dots=#f1ecf8,#e2d3f4,#c9a9e6,#a77bc9,#7a4371
            dist/github-snake-dark.svg?color_snake=#ff9ecf&color_dots=#221a38,#4b2e63,#7a4371,#c0677a,#ffc09f

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
